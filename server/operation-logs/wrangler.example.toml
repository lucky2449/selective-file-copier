name = "filemoa-operation-logs"
main = "worker.mjs"
compatibility_date = "2026-10-19"
workers_dev = true

[vars]
ALLOWED_ORIGIN = "https://lucky2449.github.io"

[[d1_databases]]
binding = "DB"
database_name = "filemoa-operation-logs"
database_id = "REPLACE_WITH_DATABASE_ID"

[[ratelimits]]
name = "GLOBAL_LIMITER"
namespace_id = "1801001"
simple = { limit = 300, period = 60 }

[[ratelimits]]
name = "SESSION_LIMITER"
namespace_id = "1801002"
simple = { limit = 60, period = 60 }

[triggers]
crons = ["20 18 * * *"]

[observability]
enabled = false
